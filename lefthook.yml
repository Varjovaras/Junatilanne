pre-commit:
    parallel: true
    commands:
        fmt:
            glob: "*.{ts,tsx,js,jsx,json,mjs,cjs}"
            run: bunx oxfmt --check {staged_files}
        lint:
            glob: "*.{ts,tsx,js,jsx}"
            run: bunx oxlint {staged_files}
pre-push:
    parallel: true
    commands:
        build:
            run: bun run build
        typecheck:
            run: bunx tsc --noEmit
